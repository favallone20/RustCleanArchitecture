[workspace]
resolver = "2"
members = [
    "contracts",
    "backend",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]

[workspace.dependencies]
# Serialization (essenziale per contracts e persistenza)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime (leggero)
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "fs"] }

# Web framework (minimale)
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }

# UUID e datetime (per contracts)
uuid = { version = "1.10", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1.0"
